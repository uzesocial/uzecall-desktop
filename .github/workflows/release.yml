name: Gerar instalador do UzeCall

# Toda vez que a versão no package.json mudar, o GitHub monta o UzeCall-Setup.exe
# e publica em Releases. O app instalado se atualiza sozinho a partir daí.
on:
  push:
    branches: [main]
    paths: ["package.json", "src/**", "assets/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: UzeCall-Setup
          path: dist/UzeCall-Setup.exe
          retention-days: 7
