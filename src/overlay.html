<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>UzeCall: pop-out</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font: 600 13px/1.2 "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; }
  #box { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 6px; }
  body.right #box { align-items: flex-end; }
  /* discreto: quase transparente; quem está falando fica um pouco mais visível */
  .canal { align-self: flex-start; padding: 2px 7px; border-radius: 6px; background: rgba(6, 8, 12, .28); color: #C9D2E3; font-size: 11px; font-weight: 600; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .45; }
  body.right .canal { align-self: flex-end; }
  .p { display: flex; align-items: center; gap: 7px; max-width: 248px; padding: 3px 9px 3px 3px; border-radius: 999px; background: rgba(6, 8, 12, .22); opacity: .42; transition: opacity .18s ease, background-color .18s ease; }
  .av { position: relative; flex: none; width: 26px; height: 26px; border-radius: 50%; background: #1B2438; display: grid; place-items: center; font-size: 11px; color: #C9D2E3; overflow: hidden; box-shadow: 0 0 0 2px transparent; transition: box-shadow .18s ease; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .nome { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0, 0, 0, .8); }
  .fala { opacity: .92; background: rgba(6, 8, 12, .5); }
  .fala .av { box-shadow: 0 0 0 2px #22C55E; }
  .ic { flex: none; width: 14px; height: 14px; opacity: .8; }
  .mais { padding: 2px 9px; font-size: 11px; color: #C9D2E3; opacity: .45; text-shadow: 0 1px 2px rgba(0, 0, 0, .8); }
</style>
</head>
<body>
<div id="box" aria-live="off"></div>
<script>
  // mic cortado e fone cortado (mesmo desenho do site)
  const MIC_OFF = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><path d="M12 19v3"/></svg>';
  const HEAD_OFF = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14h-1.343"/><path d="M9.128 3.47A9 9 0 0 1 21 12v3.343"/><path d="m2 2 20 20"/><path d="M20.414 20.414A2 2 0 0 1 19 21h-1a2 2 0 0 1-2-2v-3"/><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 2.636-6.364"/></svg>';
  const box = document.getElementById("box");
  const iniciais = (n) => (n || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  function draw(state) {
    box.textContent = "";
    if (!state) return;
    document.body.classList.toggle("right", state.corner === "top-right" || state.corner === "bottom-right");
    const canal = document.createElement("div");
    canal.className = "canal";
    canal.textContent = state.channel || "Call";
    box.appendChild(canal);
    for (const p of state.people) {
      const row = document.createElement("div");
      row.className = "p" + (p.speaking ? " fala" : "");
      const av = document.createElement("span");
      av.className = "av";
      if (p.avatar && /^https:\/\//.test(p.avatar)) {
        const img = document.createElement("img");
        img.alt = ""; img.src = p.avatar; img.referrerPolicy = "no-referrer";
        img.onerror = () => { img.remove(); av.textContent = iniciais(p.name); };
        av.appendChild(img);
      } else av.textContent = iniciais(p.name);
      const nome = document.createElement("span");
      nome.className = "nome";
      nome.textContent = p.name;
      row.append(av, nome);
      if (p.mudo) row.insertAdjacentHTML("beforeend", MIC_OFF);
      if (p.surdo) row.insertAdjacentHTML("beforeend", HEAD_OFF);
      box.appendChild(row);
    }
    if (state.more > 0) {
      const m = document.createElement("div");
      m.className = "mais";
      m.textContent = "+ " + state.more + " na call";
      box.appendChild(m);
    }
  }
  window.uzOverlay.onState(draw);
</script>
</body>
</html>
